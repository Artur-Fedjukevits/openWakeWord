# ─────────────────────────────────────────────────────────────
# Конфиг обучения openWakeWord для wake word "Эй Лёня"
# ─────────────────────────────────────────────────────────────
# Запуск:
#   python openwakeword/train.py --training_config ey_lyonya.yml --train_model
# ─────────────────────────────────────────────────────────────

# Название модели (будет именем выходных файлов .onnx и .tflite)
model_name: ey_lyonya

# Целевая фраза — именно так модель будет её "слышать"
target_phrase:
  - "эй лёня"
  - "эй леня"     # на случай разного произношения ё/е

# ВНИМАНИЕ: train.py этот ключ НЕ читает. Клипы берутся из
#   <output_dir>/<model_name>/{positive,negative}_{train,test}
# т.е. my_custom_model/ey_lyonya/positive_train и т.д.
positive_data_dir: /home/artur/openWakeWord/dataset/positive_train

# Папка для сохранения готовой модели
output_dir: /home/artur/openWakeWord/my_custom_model

# ─────────────────────────────────────────────────────────────
# Фоновые датасеты (негативные примеры)
# Скачиваются скриптом download_training_data.py (см. ниже)
# ─────────────────────────────────────────────────────────────
background_paths:
  - /home/artur/openWakeWord/audioset_16k    # Google AudioSet — разные звуки окружения
  - /home/artur/openWakeWord/fma             # Free Music Archive — музыка
  - /home/artur/openWakeWord/room_background # фон комнаты робота через Jabra (record_room_background.py)

background_paths_duplication_rate:
  - 1   # audioset (~18.7k клипов)
  - 1   # fma (~8k клипов)
  - 40  # room_background: 168 клипов ×40 ≈ 20% пула фона

# Room Impulse Response — для симуляции эха в разных помещениях
rir_paths:
  - /home/artur/openWakeWord/mit_rirs

# ─────────────────────────────────────────────────────────────
# Предвычисленные признаки (features) — скачиваются с HuggingFace
# Это самый важный файл! ~3.5 ГБ, заменяет 2000 часов аудио
# ─────────────────────────────────────────────────────────────
feature_data_files:
  ACAV100M_sample: /home/artur/openWakeWord/openwakeword_features_ACAV100M_2000_hrs_16bit.npy

# Валидационный датасет для замера false positive rate
false_positive_validation_data_path: /home/artur/validation_set_features.npy

# ─────────────────────────────────────────────────────────────
# Параметры генерации данных
# ─────────────────────────────────────────────────────────────

# Кол-во синтетических примеров для обучения
# (train.py может генерировать дополнительно через piper TTS)
n_samples: 0
n_samples_val: 0

# Путь к piper-sample-generator (для дополнительного TTS синтеза)
# Если уже есть датасет — train.py пропустит этот шаг
piper_sample_generator_path: /home/artur/openWakeWord/piper-sample-generator

# Размер батча при TTS генерации
tts_batch_size: 50

# ─────────────────────────────────────────────────────────────
# Параметры аугментации
# ─────────────────────────────────────────────────────────────
augmentation_rounds: 3
augmentation_batch_size: 16

# Негативные фразы похожие по звуку (adversarial negatives)
# Помогают снизить ложные срабатывания на похожие слова
custom_negative_phrases:
  # Имена после "эй" — самые близкие по звуку
  - "эй коля"
  - "эй соня"
  - "эй толя"
  - "эй леша"
  - "эй ваня"
  - "эй петя"
  - "эй оля"
  - "эй вася"
  - "эй женя"

  # Слова на "эй л..." — фонетически близко к началу фразы
  - "эй ладно"
  - "эй люди"
  - "эй лови"
  # Другие wake-word-подобные фразы — снижает cross-activation
  - "алиса"
  - "окей гугл"
  - "слушай"
  - "эй"

# ─────────────────────────────────────────────────────────────
# Архитектура и обучение модели
# ─────────────────────────────────────────────────────────────

# Тип модели: dnn (быстрее) или rnn (точнее, медленнее)
model_type: rnn

# Размер скрытого слоя (64 = больше ёмкости для русской двусложной фразы)
layer_size: 64

# Количество шагов обучения
# 10000 = ~10-15 мин на CPU, достаточно для начала
# 50000 = лучшее качество, но дольше
steps: 50000

# Размер батча для каждого источника данных
batch_n_per_class:
  ACAV100M_sample: 256   # фоновые признаки
  adversarial_negative: 150  # похожие фразы + фон и речь из комнаты робота (svneg/svhard/roombg)
  positive: 128              # 1714 файлов — больше батч, лучше представлены реальные голоса

# Максимальный вес негативных примеров в loss функции
# Во 2-й и 3-й фазе train.py удваивает его (×2, ×4) — всегда, target_* на это не влияют.
# v1 (мало реальных записей) с 2000: мало ложных, но много пропусков. v5 = 1500, v6 = 1700 (2026-10-11).
max_negative_weight: 1500

# ─────────────────────────────────────────────────────────────
# Целевые метрики (обучение остановится при достижении)
# ─────────────────────────────────────────────────────────────

# Минимальная точность на валидации (0.0 = не останавливать досрочно)
target_accuracy: 0.0

# Целевой recall (доля реальных активаций, которые модель поймала)
# 0.5 = ловит 50% произношений (хороший старт, потом увеличь)
target_recall: 0.90

# Максимум ложных срабатываний в час (меньше = строже)
target_false_positives_per_hour: 0.5